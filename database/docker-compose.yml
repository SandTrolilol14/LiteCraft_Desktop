# Pila de Dockge en fimosito: /opt/stacks/litecraft-db/compose.yaml
# Las contraseñas van en el .env de la pila (copiar de .env.example). NO subir el .env al repo.
# MariaDB solo lee estas variables la PRIMERA vez que arranca con ./data vacío.
services:
  mariadb-litecraft:
    image: mariadb:11.4
    container_name: litecraft_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: litecraft_db
      MARIADB_USER: ${DB_USER}            # usuario de la app, solo tiene permisos sobre litecraft_db
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Madrid
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"                      # el 3306 del host ya lo usa otro MariaDB
    volumes:
      - ./data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d   # aquí va schema.sql (solo se ejecuta con ./data vacío)
