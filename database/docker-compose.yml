# Pila de Dockge: /opt/stacks/litecraft/compose.yaml en fimosito
# Las contraseñas van en el .env (copiar de .env.example). NO subir el .env al repo.
services:
  litecraft_db:
    image: mariadb:11.4
    container_name: litecraft_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: litecraft_db
      MARIADB_USER: ${DB_USER}            # usuario de la app, solo tiene permisos sobre litecraft_db
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Madrid
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"                      # el 3306 del host ya lo usa otro MariaDB
    volumes:
      - litecraft_db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  litecraft_db_data:
